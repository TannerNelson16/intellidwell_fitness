server {
    listen 80;
    server_name fit.intellidwell.net;
    client_max_body_size 20M;

    # Certbot uses this block to solve the HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all regular traffic to HTTPS once the cert is issued.
    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/fit.intellidwell.net.access.log;
    error_log /var/log/nginx/fit.intellidwell.net.error.log;
}

server {
    listen 443 ssl http2;
    server_name fit.intellidwell.net;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/fit.intellidwell.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fit.intellidwell.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:5917;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /static/ {
        alias /home/nelsonserver/websites/intellidwell_fitness/static/;
        add_header Cache-Control "public, max-age=3600";
    }

    access_log /var/log/nginx/fit.intellidwell.net.access.log;
    error_log /var/log/nginx/fit.intellidwell.net.error.log;
}
